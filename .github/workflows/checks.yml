# Required on every PR into main: lint and tests where there are any, the image builds, and the
# version in package.json never goes below the latest release.
name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version
        run: |
          version=$(node -p "require('./package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$version in package.json is not a semver x.y.z"; exit 1; }
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | head -n1)" != "$latest" ]; then
            echo "$version in package.json is below the latest release $latest"; exit 1
          fi
          echo "version $version, latest release ${latest:-none}"

      - uses: docker/setup-buildx-action@v3
      - name: Image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
